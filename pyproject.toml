[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-harness"
version = "0.2.0"
description = "A thin, agent-friendly ADB harness for controlling a real Android phone"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "android-harness contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
android-harness = "android_harness.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
android_harness = [
    "skills/android-harness/SKILL.md",
    "skills/android-harness/agents/*.yaml",
    "skills/android-harness/references/*.md",
    "skills/android-harness/scripts/*.ps1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
